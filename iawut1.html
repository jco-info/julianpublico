<!DOCTYPE html>

    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #4da6ff;
            --primary-hover: #3388dd;
            --border-color: #333;
            --option-bg: #2a2a2a;
            --option-hover: #383838;
            --correct-bg: #1e4620;
            --correct-text: #81c784;
            --incorrect-bg: #4a1c1c;
            --incorrect-text: #e57373;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        #start-screen {
            text-align: center;
            padding: 20px 0;
        }

        .select-container {
            margin: 20px 0;
            font-size: 18px;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            background-color: var(--option-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--option-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            border: 1px solid var(--border-color);
        }

        .pregunta {
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: var(--bg-color);
        }

        .enunciado {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.5;
        }

        code {
            background-color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #f8c555;
        }

        .opcion {
            display: block;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: var(--option-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }

        .opcion:hover {
            background: var(--option-hover);
        }

        .opcion input {
            margin-right: 10px;
            cursor: pointer;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
            line-height: 1.4;
        }

        .correcto {
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid #388e3c;
        }

        .incorrecto {
            background-color: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid #d32f2f;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #resultado-final {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

    let preguntasTest = [];
    let puntuacion = 0;

    function mezclarArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function iniciarTest() {
        let cantidad = parseInt(document.getElementById('num-preguntas').value);
        if (cantidad > bancoPreguntas.length) cantidad = bancoPreguntas.length;

        // Barajar preguntas
        let preguntasBarajadas = mezclarArray([...bancoPreguntas]);
        preguntasTest = preguntasBarajadas.slice(0, cantidad);

        // Barajar opciones y recalcular índices correctos
        preguntasTest = preguntasTest.map(p => {
            // Creamos un array de objetos con el texto original y si era correcta o no
            let opcionesConEstado = p.opciones.map((texto, index) => ({
                texto: texto,
                esCorrecta: p.correctas.includes(index)
            }));

            // Barajamos las opciones
            let opcionesBarajadas = mezclarArray(opcionesConEstado);
            
            // Buscamos cuáles son los nuevos índices correctos
            let nuevasCorrectas = [];
            opcionesBarajadas.forEach((opt, index) => {
                if (opt.esCorrecta) nuevasCorrectas.push(index);
            });

            return {
                tipo: p.tipo,
                enunciado: p.enunciado,
                opciones: opcionesBarajadas.map(opt => opt.texto),
                correctas: nuevasCorrectas
            };
        });

        // UI
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('btn-reiniciar').classList.add('hidden');
        document.getElementById('btn-corregir').classList.remove('hidden');
        document.getElementById('resultado-final').style.display = 'none';
        
        puntuacion = 0;
        document.getElementById('puntuacion').textContent = puntuacion;
        document.getElementById('total-preguntas').textContent = preguntasTest.length;

        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        preguntasTest.forEach((p, index) => {
            const divPregunta
             preguntasTest.forEach((p, index) => {
            const divPregunta = document.createElement('div');
            divPregunta.className = 'pregunta';
            divPregunta.id = `pregunta-${index}`;

            // Indicar el tipo de pregunta
            const tipoTexto = p.tipo === 'multiple' 
                ? '<span style="color:#f8c555; font-size:13px;">(Selección múltiple — marca todas las correctas)</span>' 
                : '';

            let html = `<div class="enunciado">${index + 1}. ${p.enunciado} ${tipoTexto}</div>`;
            
            p.opciones.forEach((opcion, optIndex) => {
                const inputType = p.tipo === 'multiple' ? 'checkbox' : 'radio';
                html += `
                    <label class="opcion" id="label-${index}-${optIndex}">
                        <input type="${inputType}" name="pregunta-${index}" value="${optIndex}">
                        ${opcion}
                    </label>
                `;
            });

            html += `<div class="feedback" id="feedback-${index}"></div>`;
            divPregunta.innerHTML = html;
            container.appendChild(divPregunta);
        });

        window.scrollTo(0, 0);
    }

    function corregirTest() {
        puntuacion = 0;
        let desgloseHTML = '<h3>Resumen de respuestas:</h3><ul style="text-align:left; font-size: 16px;">';

        preguntasTest.forEach((p, index) => {
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            const labels = document.querySelectorAll(`#pregunta-${index} .opcion`);
            
            // Resetear bordes
            labels.forEach(l => l.style.border = "1px solid var(--border-color)");
            feedbackDiv.style.display = 'block';

            // Obtener seleccionadas (radio o checkbox)
            const seleccionadas = document.querySelectorAll(`input[name="pregunta-${index}"]:checked`);
            const indicesSeleccionados = Array.from(seleccionadas).map(inp => parseInt(inp.value));

            // Comparar conjuntos (orden no importa)
            const correctasOrdenadas = [...p.correctas].sort((a,b) => a-b);
            const seleccionadasOrdenadas = [...indicesSeleccionados].sort((a,b) => a-b);
            const esCorrecta = 
                correctasOrdenadas.length === seleccionadasOrdenadas.length &&
                correctasOrdenadas.every((v, i) => v === seleccionadasOrdenadas[i]);

            // Marcar visualmente: correctas en verde, incorrectas seleccionadas en rojo
            p.correctas.forEach(c => {
                document.getElementById(`label-${index}-${c}`).style.border = "2px solid #28a745";
            });
            indicesSeleccionados.forEach(s => {
                if (!p.correctas.includes(s)) {
                    document.getElementById(`label-${index}-${s}`).style.border = "2px solid #dc3545";
                }
            });

            // Texto de respuestas del usuario y correctas
            const textoUsuario = indicesSeleccionados.length > 0
                ? indicesSeleccionados.map(i => `"${p.opciones[i]}"`).join(', ')
                : 'Sin contestar';
            const textoCorrectas = p.correctas.map(i => `"${p.opciones[i]}"`).join(', ');

            if (esCorrecta) {
                puntuacion++;
                feedbackDiv.className = 'feedback correcto';
                feedbackDiv.textContent = '✅ ¡Correcto!';
                desgloseHTML += `<li style="margin-bottom: 10px; color: #81c784;">✅ <strong>Pregunta ${index + 1}:</strong> Acertaste.</li>`;
            } else {
                feedbackDiv.className = 'feedback incorrecto';
                feedbackDiv.innerHTML = `❌ Incorrecto. La respuesta correcta era: <strong>${textoCorrectas}</strong>`;
                desgloseHTML += `<li style="margin-bottom: 10px; color: #e57373;">❌ <strong>Pregunta ${index + 1}:</strong> Tu respuesta fue: <em>${textoUsuario}</em>.<br>La correcta es: <strong>${textoCorrectas}</strong></li>`;
            }
        });

        desgloseHTML += '</ul>';

        document.getElementById('puntuacion').textContent = puntuacion;
        
        const finalDiv = document.getElementById('resultado-final');
        finalDiv.style.display = 'block';
        
        let mensajeFinal = "";
        if (puntuacion === preguntasTest.length) {
            finalDiv.style.color = '#81c784';
            finalDiv.style.backgroundColor = 'var(--correct-bg)';
            mensajeFinal = `🎉 ¡Perfecto! Has acertado todas (${puntuacion}/${preguntasTest.length}).`;
        } else if (puntuacion >= preguntasTest.length / 2) {
            finalDiv.style.color = '#f8c555';
            finalDiv.style.backgroundColor = '#3e3116';
            mensajeFinal = `Has acertado ${puntuacion} de ${preguntasTest.length}. ¡Sigue practicando!`;
        } else {
            finalDiv.style.color = '#e57373';
            finalDiv.style.backgroundColor = 'var(--incorrect-bg)';
            mensajeFinal = `Has acertado ${puntuacion} de ${preguntasTest.length}. Necesitas repasar los apuntes.`;
        }

        finalDiv.innerHTML = `<div style="font-size: 24px; margin-bottom: 20px;">${mensajeFinal}</div>${desgloseHTML}`;

        // Deshabilitar botón de corregir, mostrar reiniciar
        document.getElementById('btn-corregir').classList.add('hidden');
        document.getElementById('btn-reiniciar').classList.remove('hidden');
        
        // Deshabilitar los inputs
        document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => {
            input.disabled = true;
        });

        // Scroll al resultado
        finalDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function reiniciar() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        window.scrollTo(0, 0);
    }
</script>
