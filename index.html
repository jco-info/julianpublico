<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica UT1 - Arquitectura Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .pregunta {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #fafafa;
        }
        .enunciado {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .opcion {
            display: block;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .opcion:hover {
            background: #e8f4f8;
        }
        .opcion input {
            margin-right: 10px;
        }
        .feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }
        .correcto {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .incorrecto {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }
        .btn:hover {
            background: #2980b9;
        }
        #resultado-final {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Práctica UT1 - Arquitectura Web</h1>
    
    <div class="header-info">
        <span>Preguntas: <span id="total-preguntas">0</span></span>
        <span>Puntuación: <span id="puntuacion">0</span></span>
    </div>

    <div id="quiz-container">
        <!-- Las preguntas se generarán con JavaScript -->
    </div>

    <button class="btn" onclick="corregirTest()">Corregir Test</button>
    <div id="resultado-final"></div>
</div>

<script>
    // Aquí tienes las preguntas y respuestas exactas extraídas de tus apuntes.
    // La propiedad 'correcta' indica el índice (empezando por 0) de la opción verdadera.
    const preguntas = [
        {
            enunciado: "Una aplicación oculta mediante código del cliente el botón Eliminar producto a los usuarios que no son administradores. Sin embargo, el servidor realiza la eliminación siempre que recibe la solicitud correspondiente, sin comprobar quién la ha enviado. ¿Cuál es el problema principal?",
            opciones: [
                "La única solución es ejecutar toda la aplicación en el navegador.",
                "El servidor debe comprobar los permisos antes de realizar la operación, aunque el botón esté oculto en el cliente.",
                "El problema es que los administradores nunca deben poder eliminar productos.",
                "No existe ningún problema porque un botón oculto no puede utilizarse de cualquier otra forma."
            ],
            correcta: 1
        },
        {
            enunciado: "Un usuario pulsa Ver productos. El navegador solicita la información al servidor. La aplicación procesa la solicitud, obtiene los datos necesarios y genera una respuesta. Finalmente, el navegador muestra el resultado. ¿Cuál de las siguientes afirmaciones describe correctamente la situación?",
            opciones: [
                "Todo el procesamiento descrito se ha realizado exclusivamente en el navegador.",
                "Todo el proceso se ha realizado exclusivamente en el servidor y el navegador no ha intervenido.",
                "Han participado tanto el cliente como el servidor en el proceso.",
                "Para que funcione, el navegador debe ejecutar necesariamente el código Python del servidor."
            ],
            correcta: 2
        },
        {
            enunciado: "Un formulario utiliza JavaScript para comprobar que la edad introducida sea mayor que 0. El programador decide que, como ya se ha comprobado en el navegador, el servidor aceptará siempre el valor recibido. ¿Cuál es la valoración correcta?",
            opciones: [
                "Es incorrecto: puede realizarse una comprobación inicial en cliente, pero el servidor debe validar definitivamente los datos recibidos.",
                "Es correcto siempre que el formulario se muestre correctamente en pantalla.",
                "Es correcto: cualquier dato validado mediante JavaScript puede considerarse seguro.",
                "Es incorrecto únicamente porque JavaScript no puede realizar ninguna comprobación de formularios."
            ],
            correcta: 0
        },
        {
            enunciado: "Una aplicación utiliza Python en el servidor para calcular una tabla de multiplicar. ¿Qué recibe normalmente el navegador?",
            opciones: [
                "El resultado generado por el servidor.",
                "El código Python completo que ha realizado el cálculo.",
                "El intérprete de Python utilizado por el servidor.",
                "El entorno virtual del proyecto."
            ],
            correcta: 0
        },
        {
            enunciado: "Observa el siguiente fragmento: <br><code>&lt;button onclick=\"mostrar()\"&gt;Mostrar&lt;/button&gt;</code><br>En el modelo estudiado, ¿dónde se interpreta este elemento HTML?",
            opciones: [
                "En el navegador del cliente.",
                "Únicamente en el servidor Python.",
                "En la base de datos.",
                "En el sistema operativo del servidor antes de enviar la página."
            ],
            correcta: 0
        },
        {
            enunciado: "Observa el siguiente fragmento: <br><code>for producto in productos:<br>&nbsp;&nbsp;&nbsp;&nbsp;resultado += producto.nombre</code><br>En el modelo utilizado durante el curso, ¿dónde se ejecutaría normalmente este código?",
            opciones: [
                "En el archivo HTML una vez descargado.",
                "Directamente en el navegador del usuario.",
                "En el servidor.",
                "En la hoja de estilos CSS."
            ],
            correcta: 2
        },
        {
            enunciado: "¿Cuál de las siguientes afirmaciones sobre cliente y servidor es incorrecta?",
            opciones: [
                "El servidor puede procesar una petición y generar una respuesta.",
                "Cliente y servidor pueden estar muy alejados físicamente cuando se comunican a través de una red.",
                "Cliente y servidor deben encontrarse siempre en máquinas físicas diferentes.",
                "El cliente solicita información o servicios."
            ],
            correcta: 2
        },
        {
            enunciado: "¿Cuál de las siguientes descripciones representa mejor una aplicación web?",
            opciones: [
                "Un documento que siempre contiene únicamente información estática.",
                "Un programa que necesariamente se instala y ejecuta por completo en el equipo del usuario.",
                "Una aplicación a la que normalmente se accede mediante un navegador y que puede comunicarse con uno o varios servidores.",
                "Un programa que no puede comunicarse con otros equipos."
            ],
            correcta: 2
        },
        {
            enunciado: "Un alumno explica el funcionamiento de una tienda web de esta forma: \"El navegador consulta directamente la base de datos para obtener los productos y, después, comunica al servidor lo que ha encontrado.\" ¿Cuál es el error principal de esta explicación?",
            opciones: [
                "El navegador no debería acceder directamente a la base de datos; la aplicación del servidor debe realizar ese acceso.",
                "El error es utilizar un navegador como cliente.",
                "El servidor nunca puede utilizar una base de datos.",
                "Una tienda web no puede almacenar productos en una base de datos."
            ],
            correcta: 0
        },
        {
            enunciado: "Una empresa modifica su aplicación en el servidor. Al volver a entrar desde el navegador, todos los usuarios utilizan la nueva versión sin instalarla manualmente en sus equipos. ¿Qué característica de las aplicaciones web se refleja principalmente en esta situación?",
            opciones: [
                "La aplicación puede actualizarse centralmente en el servidor.",
                "La aplicación deja de utilizar una arquitectura cliente-servidor.",
                "El navegador pasa a almacenar toda la aplicación de forma permanente.",
                "Cada usuario debe instalar localmente la nueva versión."
            ],
            correcta: 0
        },
        {
            enunciado: "Una página contiene un título y una lista de productos. El título tiene un estilo personalizado. Al pulsar un botón se modifica inmediatamente una parte de la interfaz. El contenido inicial de la lista ha sido generado por una aplicación escrita en Python. ¿Qué descripción representa mejor el papel de las tecnologías utilizadas?",
            opciones: [
                "Flask es el lenguaje de marcas que define la estructura y CSS ejecuta el código Python.",
                "HTML define la estructura, CSS la apariencia, JavaScript la interacción en el navegador y Python/Flask genera contenido y lógica en el servidor.",
                "CSS genera los productos, Python modifica exclusivamente el aspecto y HTML ejecuta la lógica del servidor.",
                "JavaScript sustituye a todas las demás tecnologías y realiza por sí solo estructura, estilo y lógica del servidor."
            ],
            correcta: 1
        },
        {
            enunciado: "Dos usuarios solicitan la misma dirección /perfil, pero cada uno recibe una página con su propio nombre e información. ¿Qué describe mejor esta situación?",
            opciones: [
                "Es necesariamente un único archivo HTML estático idéntico para todos los usuarios.",
                "Significa que CSS está generando los datos del usuario.",
                "Es contenido dinámico generado por la aplicación.",
                "Significa que el navegador está sustituyendo completamente al servidor."
            ],
            correcta: 2
        },
        {
            enunciado: "¿Cuál de las siguientes descripciones define mejor Flask?",
            opciones: [
                "Una hoja de estilos utilizada para modificar la apariencia de una página.",
                "Un framework web que permite desarrollar aplicaciones utilizando Python.",
                "Un navegador web diseñado para ejecutar páginas HTML.",
                "Un lenguaje de programación que sustituye a Python."
            ],
            correcta: 1
        },
        {
            enunciado: "Observa el siguiente fragmento:<br><code>h1 {<br>&nbsp;&nbsp;&nbsp;&nbsp;font-size: 30px;<br>&nbsp;&nbsp;&nbsp;&nbsp;margin-bottom: 15px;<br>}</code><br>¿Qué tecnología aparece principalmente en este fragmento?",
            opciones: [
                "Python",
                "CSS",
                "HTML",
                "Flask"
            ],
            correcta: 1
        },
        {
            enunciado: "Observa el siguiente fragmento:<br><code>&lt;h1&gt;Productos&lt;/h1&gt;<br>&lt;ul&gt;<br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;li&gt;Teclado&lt;/li&gt;<br>&lt;/ul&gt;</code><br>¿Qué tecnología aparece principalmente en este fragmento?",
            opciones: [
                "Python",
                "Flask",
                "CSS",
                "HTML"
            ],
            correcta: 3
        },
        {
            enunciado: "Observa el siguiente mensaje:<br><code>HTTP/1.1 200 OK<br>Content-Type: text/html</code><br>¿Qué representa?",
            opciones: [
                "Una respuesta HTTP generada por el servidor.",
                "Una petición HTTP enviada por el cliente.",
                "Una consulta SQL.",
                "Una orden para instalar Flask."
            ],
            correcta: 0
        },
        {
            enunciado: "El servidor acaba de recibir:<br><code>GET /productos HTTP/1.1</code><br>¿Cuál es el siguiente paso lógico en el flujo estudiado?",
            opciones: [
                "Enviar una respuesta antes de procesar la petición.",
                "Procesar la petición y determinar qué respuesta debe generar.",
                "Convertir GET en un archivo CSS.",
                "Cerrar automáticamente el navegador."
            ],
            correcta: 1
        },
        {
            enunciado: "Un formulario envía al servidor los datos de un nuevo alumno para que sean procesados. ¿Qué método utilizaríamos habitualmente?",
            opciones: [
                "GET",
                "PATCH",
                "DELETE",
                "POST"
            ],
            correcta: 3
        },
        {
            enunciado: "¿Cuál de las siguientes direcciones utiliza HTTPS?",
            opciones: [
                "https://www.ejemplo.com",
                "http://www.ejemplo.com",
                "ftp://www.ejemplo.com",
                "file://www.ejemplo.com"
            ],
            correcta: 0
        },
        {
            enunciado: "Un formulario envía datos para crear un nuevo recurso. El servidor lo crea correctamente. ¿Qué combinación resulta coherente?",
            opciones: [
                "PATCH + 301 Moved Permanently",
                "DELETE + 500 Internal Server Error",
                "GET + 404 Not Found",
                "POST + 201 Created"
            ],
            correcta: 3
        },
        {
            enunciado: "Una aplicación solicita al servidor que elimine un recurso existente. ¿Qué método expresa mejor esa operación?",
            opciones: [
                "GET",
                "DELETE",
                "PATCH",
                "POST"
            ],
            correcta: 1
        },
        {
            enunciado: "En la dirección <code>https://www.ejemplo.com/productos</code>, ¿qué parte permite identificar que se está utilizando HTTPS?",
            opciones: [
                "/productos",
                "https",
                "www.ejemplo.com",
                ".com"
            ],
            correcta: 1
        },
        {
            enunciado: "Una aplicación utiliza HTTPS. ¿Significa esto que cualquier dato introducido por el usuario puede aceptarse sin validarlo?",
            opciones: [
                "Sí. HTTPS sustituye cualquier control de seguridad del servidor.",
                "Sí. HTTPS garantiza que todos los datos enviados por el usuario sean correctos.",
                "No, porque HTTPS solo puede utilizarse para descargar imágenes.",
                "No. HTTPS protege la comunicación, pero la aplicación debe seguir validando los datos y aplicando medidas de seguridad."
            ],
            correcta: 3
        },
        {
            enunciado: "Durante la ejecución de una aplicación aparece:<br><code>\"GET /noexiste HTTP/1.1\" 404</code><br>¿Qué podemos deducir?",
            opciones: [
                "Se ha solicitado /noexiste y el servidor no ha encontrado el recurso.",
                "El servidor ha realizado una redirección permanente.",
                "El recurso se ha creado correctamente.",
                "La petición se ha procesado correctamente con código 200."
            ],
            correcta: 0
        },
        {
            enunciado: "El servidor procesa correctamente la solicitud y devuelve el recurso solicitado. ¿Qué código es el más representativo?",
            opciones: [
                "403 Forbidden",
                "200 OK",
                "500 Internal Server Error",
                "404 Not Found"
            ],
            correcta: 1
        },
        {
            enunciado: "El servidor procesa una operación y crea correctamente un nuevo recurso. ¿Qué código resulta apropiado?",
            opciones: [
                "500 OK",
                "404 Created",
                "201 Created",
                "200 Not Found"
            ],
            correcta: 2
        },
        {
            enunciado: "El usuario quiere consultar un listado de alumnos sin modificarlo. ¿Qué método HTTP representa mejor esta operación?",
            opciones: [
                "POST",
                "GET",
                "DELETE",
                "PATCH"
            ],
            correcta: 1
        },
        {
            enunciado: "El servidor conoce al usuario, pero este no tiene permiso para acceder al recurso solicitado. ¿Qué código encaja mejor?",
            opciones: [
                "401 Unauthorized",
                "200 OK",
                "403 Forbidden",
                "404 Not Found"
            ],
            correcta: 2
        },
        {
            enunciado: "El servidor recibe la petición, pero la aplicación produce una excepción mientras intenta procesarla. ¿Qué código es el más coherente?",
            opciones: [
                "500 Internal Server Error",
                "301 Moved Permanently",
                "404 Not Found",
                "200 OK"
            ],
            correcta: 0
        }
    ];

    const container = document.getElementById('quiz-container');
    const totalSpan = document.getElementById('total-preguntas');
    const puntuacionSpan = document.getElementById('puntuacion');
    
    totalSpan.textContent = preguntas.length;
    let puntuacion = 0;

    // Generar el HTML de las preguntas
    preguntas.forEach((p, index) => {
        const divPregunta = document.createElement('div');
        divPregunta.className = 'pregunta';
        divPregunta.id = `pregunta-${index}`;

        let html = `<div class="enunciado">${index + 1}. ${p.enunciado}</div>`;
        
        p.opciones.forEach((opcion, optIndex) => {
            html += `
                <label class="opcion" id="label-${index}-${optIndex}">
                    <input type="radio" name="pregunta-${index}" value="${optIndex}">
                    ${opcion}
                </label>
            `;
        });

        html += `<div class="feedback" id="feedback-${index}"></div>`;
        divPregunta.innerHTML = html;
        container.appendChild(divPregunta);
    });

    function corregirTest() {
        puntuacion = 0;

        preguntas.forEach((p, index) => {
            const seleccionada = document.querySelector(`input[name="pregunta-${index}"]:checked`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            const labels = document.querySelectorAll(`#pregunta-${index} .opcion`);
            
            // Limpiar estilos previos
            labels.forEach(l => l.style.border = "1px solid #ccc");
            feedbackDiv.style.display = 'block';

            if (!seleccionada) {
                feedbackDiv.className = 'feedback incorrecto';
                feedbackDiv.textContent = '⚠️ No has contestado a esta pregunta.';
                return;
            }

            const valorSeleccionado = parseInt(seleccionada.value);

            if (valorSeleccionado === p.correcta) {
                puntuacion++;
                feedbackDiv.className = 'feedback correcto';
                feedbackDiv.textContent = '✅ ¡Correcto!';
                document.getElementById(`label-${index}-${valorSeleccionado}`).style.border = "2px solid #28a745";
            } else {
                feedbackDiv.className = 'feedback incorrecto';
                feedbackDiv.innerHTML = `❌ Incorrecto. La respuesta correcta era: <strong>${p.opciones[p.correcta]}</strong>`;
                document.getElementById(`label-${index}-${valorSeleccionado}`).style.border = "2px solid #dc3545";
                document.getElementById(`label-${index}-${p.correcta}`).style.border = "2px solid #28a745";
            }
        });

        puntuacionSpan.textContent = puntuacion;
        
        const finalDiv = document.getElementById('resultado-final');
        finalDiv.style.display = 'block';
        
        if (puntuacion === preguntas.length) {
            finalDiv.style.color = '#28a745';
            finalDiv.textContent = `🎉 ¡Perfecto! Has acertado todas (${puntuacion}/${preguntas.length}).`;
        } else if (puntuacion >= preguntas.length / 2) {
            finalDiv.style.color = '#f39c12';
            finalDiv.textContent = `Has acertado ${puntuacion} de ${preguntas.length}. ¡Sigue practicando!`;
        } else {
            finalDiv.style.color = '#dc3545';
            finalDiv.textContent = `Has acertado ${puntuacion} de ${preguntas.length}. Necesitas repasar los apuntes.`;
        }
    }
</script>

</body>
</html>
