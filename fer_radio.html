<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Radio</title>

    <style>
        /* --- Reset y estilos globales --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Impact', 'Arial Black', 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- Contenedor principal --- */
        #app {
            width: 100%;
            max-width: 520px;
        }

        /* --- Tarjeta principal (estilo rock) --- */
        .rocket-radio-wrapper {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 24px;
            padding: 30px 25px 25px;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.9),
                inset 0 0 30px rgba(200, 50, 50, 0.05);
            border: 2px solid #2a1a1a;
            border-top: 2px solid #4a2a2a;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* --- Efecto de fondo rock (rayas sutiles) --- */
        .rocket-radio-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 20px,
                    rgba(255, 50, 50, 0.02) 20px,
                    rgba(255, 50, 50, 0.02) 21px
                );
            pointer-events: none;
            z-index: 0;
        }

        /* --- Logo (sin recorte) --- */
        .logo-container {
            position: relative;
            z-index: 1;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            max-width: 130px;
            width: 100%;
            height: auto;
            /* Mantiene la proporción original */
            object-fit: contain;
            /* No recorta la imagen */
            border-radius: 12px;
            /* Esquinas ligeramente redondeadas (opcional) */
            border: 3px solid #4a2a2a;
            box-shadow:
                0 0 30px rgba(200, 50, 50, 0.15),
                inset 0 0 20px rgba(200, 50, 50, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
            background: #111;
            padding: 5px;
            /* Pequeño padding para que la imagen respire */
        }

        .logo-container img:hover {
            transform: scale(1.04);
            box-shadow: 0 0 50px rgba(200, 50, 50, 0.3);
        }

        /* --- Título de la emisora --- */
        .station-title {
            position: relative;
            z-index: 1;
            font-size: 2.4rem;
            font-weight: 900;
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            text-shadow:
                0 0 20px rgba(200, 50, 50, 0.3),
                0 2px 0 #4a1a1a,
                0 4px 0 #2a0a0a;
            margin-bottom: 2px;
        }

        .station-title span {
            color: #ff4444;
            text-shadow:
                0 0 30px rgba(255, 50, 50, 0.5),
                0 2px 0 #4a1a1a;
        }

        /* --- Eslogan --- */
        .slogan {
            position: relative;
            z-index: 1;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 0.95rem;
            color: #aa8855;
            letter-spacing: 2px;
            margin-bottom: 18px;
            border-bottom: 1px solid #2a1a1a;
            padding-bottom: 14px;
            text-shadow: 0 0 20px rgba(170, 136, 85, 0.15);
        }

        .slogan::before,
        .slogan::after {
            content: '♫';
            color: #4a2a2a;
            margin: 0 10px;
            font-size: 0.8rem;
        }

        /* --- Iframe con la página original --- */
        .iframe-container {
            position: relative;
            z-index: 1;
            background: #0a0a0a;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #2a1a1a;
            box-shadow:
                inset 0 0 30px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(200, 50, 50, 0.05);
            width: 100%;
            height: 580px;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #0a0a0a;
        }

        /* --- Pie de página rock --- */
        .footer {
            position: relative;
            z-index: 1;
            margin-top: 18px;
            color: #333;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
        }

        .footer a {
            color: #665544;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #ff4444;
        }

        .footer .rock-symbol {
            color: #4a2a2a;
            margin: 0 8px;
        }

        /* --- Efecto de guitarra (decorativo) --- */
        .guitar-strings {
            position: relative;
            z-index: 1;
            height: 2px;
            background: linear-gradient(to right, transparent, #4a2a2a 20%, #4a2a2a 80%, transparent);
            margin: 6px 0 12px 0;
            opacity: 0.3;
        }

        .guitar-strings::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(to right, transparent, #4a2a2a 30%, #4a2a2a 70%, transparent);
            opacity: 0.5;
        }

        /* ========================================= */
        /* RESPONSIVE - ADAPTACIÓN A TODAS LAS PANTALLAS */
        /* ========================================= */

        /* Tablets y móviles grandes */
        @media (max-width: 768px) {
            #app {
                max-width: 90%;
            }

            .rocket-radio-wrapper {
                padding: 25px 20px 20px;
            }

            .station-title {
                font-size: 2rem;
                letter-spacing: 3px;
            }

            .logo-container img {
                max-width: 110px;
            }

            .iframe-container {
                height: 500px;
            }
        }

        /* Móviles (600px) */
        @media (max-width: 600px) {
            #app {
                max-width: 100%;
            }

            .rocket-radio-wrapper {
                padding: 20px 15px 18px;
                border-radius: 18px;
            }

            .station-title {
                font-size: 1.7rem;
                letter-spacing: 2px;
            }

            .logo-container img {
                max-width: 95px;
                padding: 4px;
            }

            .slogan {
                font-size: 0.8rem;
            }

            .slogan::before,
            .slogan::after {
                content: '•';
                margin: 0 6px;
            }

            .iframe-container {
                height: 460px;
                border-radius: 12px;
            }

            .footer {
                font-size: 0.55rem;
                letter-spacing: 1px;
            }
        }

        /* Móviles pequeños (450px) */
        @media (max-width: 450px) {
            .rocket-radio-wrapper {
                padding: 15px 12px 15px;
                border-radius: 16px;
            }

            .station-title {
                font-size: 1.4rem;
                letter-spacing: 1px;
            }

            .station-title span {
                display: inline;
            }

            .logo-container img {
                max-width: 80px;
                padding: 3px;
                border-width: 2px;
            }

            .slogan {
                font-size: 0.7rem;
                margin-bottom: 14px;
                padding-bottom: 10px;
            }

            .guitar-strings {
                margin: 4px 0 8px 0;
            }

            .iframe-container {
                height: 440px;
                border-radius: 10px;
                border-width: 1px;
            }

            .footer .rock-symbol {
                margin: 0 4px;
            }

            .footer {
                font-size: 0.5rem;
                margin-top: 12px;
            }
        }

        /* Móviles muy pequeños (380px) */
        @media (max-width: 380px) {
            .station-title {
                font-size: 1.2rem;
            }

            .logo-container img {
                max-width: 70px;
            }

            .iframe-container {
                height: 420px;
            }

            .slogan::before,
            .slogan::after {
                content: '';
                margin: 0;
            }
        }

        /* Pantallas muy grandes (escritorio) */
        @media (min-width: 1200px) {
            #app {
                max-width: 580px;
            }

            .logo-container img {
                max-width: 150px;
            }

            .station-title {
                font-size: 2.8rem;
            }

            .iframe-container {
                height: 620px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="rocket-radio-wrapper">

            <!-- ========================================= -->
            <!-- LOGO DE LA EMISORA (SIN RECORTE)           -->
            <!-- ========================================= -->
            <div class="logo-container">
                <img src="logo.jpeg" alt="Rocket Radio Logo" />
            </div>

            <!-- ========================================= -->
            <!-- TÍTULO Y ESLÓGAN                           -->
            <!-- ========================================= -->
            <div class="station-title">
                <span>Rocket</span> Radio
            </div>

            <div class="guitar-strings"></div>

            <div class="slogan">
                Donde el Rock nunca muere
            </div>

            <!-- ========================================= -->
            <!-- IFRAME CON LA PÁGINA ORIGINAL             -->
            <!-- ========================================= -->
            <div class="iframe-container">
                <iframe
                    src="https://s5.citrus3.com:2020/public/rocketradio"
                    allow="autoplay"
                    loading="lazy"
                    sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
                ></iframe>
            </div>

            <!-- ========================================= -->
            <!-- PIE DE PÁGINA ROCK                        -->
            <!-- ========================================= -->
            <div class="footer">
                <span class="rock-symbol">⚡</span>
                <a href="https://s5.citrus3.com:2020/public/rocketradio" target="_blank">Rocket Radio</a>
                <span class="rock-symbol">✦</span>
                Streaming en vivo
                <span class="rock-symbol">⚡</span>
                <br />
                <span style="color: #222; font-size: 0.6rem;">🎸 Powered by Citrus3</span>
            </div>

        </div>
    </div>

</body>
</html>
