<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Radio - Rock sin fronteras</title>
    <meta name="description" content="Rocket Radio - La mejor emisora de Rock 24/7" />
    <link rel="icon" type="image/jpeg" href="logo.jpeg" />

    
    <style>
        /* ============================================================
                   RESET Y VARIABLES
                ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --bg-card: #121212;
            --bg-surface: #1a1a1a;
            --border: #2a2a2a;
            --text: #f0f0f0;
            --text-muted: #999;
            --accent: #cc2222;
            --accent-hover: #ff3333;
            --vu-bg: #1a1a1a;
            --vu-border: #333;
            --vu-needle: #cc2222;
            --shadow: rgba(200, 50, 50, 0.15);
            --transition: 0.3s ease;
        }

        /* Tema claro */
        [data-theme="light"] {
            --bg: #f0f0f0;
            --bg-card: #ffffff;
            --bg-surface: #e8e8e8;
            --border: #cccccc;
            --text: #111111;
            --text-muted: #555;
            --accent: #cc2222;
            --accent-hover: #ff3333;
            --vu-bg: #e8e8e8;
            --vu-border: #aaaaaa;
            --shadow: rgba(200, 50, 50, 0.1);
        }

        /* ============================================================
                   BASE
                ============================================================ */
        html,
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            transition: background var(--transition), color var(--transition);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(200, 50, 50, 0.06) 0%, transparent 60%),
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 40px,
                    rgba(255, 255, 255, 0.01) 40px,
                    rgba(255, 255, 255, 0.01) 41px
                );
        }

        /* ============================================================
                   CONTENEDOR PRINCIPAL
                ============================================================ */
        .page-wrapper {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        /* ============================================================
                   BOTONES DE TEMA (ambos hacen lo mismo)
                ============================================================ */
        .theme-buttons {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            pointer-events: none;
        }
        .theme-btn {
            pointer-events: auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            min-width: 90px;
            justify-content: center;
        }
        .theme-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--shadow);
        }
        .theme-btn .icon {
            font-size: 1.1rem;
        }

        /* ============================================================
                   CABECERA / HERO
                ============================================================ */
        .hero {
            text-align: center;
            padding: 20px 0 10px;
            width: 100%;
        }

        .logo {
            width: 175px;        /* Antes: 100px */
            height: 175px;       /* Antes: 100px */
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid var(--border);
            background: var(--bg-card);
            margin-bottom: 12px;
            display: inline-block;
        }

        .hero-title {
            font-size: clamp(2.2rem, 7vw, 3.8rem);
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text);
            line-height: 1.1;
        }
        .hero-title span {
            color: var(--accent);
        }

        .hero-slogan {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-style: italic;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 1px;
        }
        .hero-slogan .highlight {
            color: var(--accent);
            font-weight: 700;
        }

        .hero-sub {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: var(--text);
            margin-top: 2px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* ============================================================
                   VÚMETROS MINI (SOLO EN MÓVIL, CENTRADOS) - MÁS GRANDES
                ============================================================ */
        .vu-mini-wrap {
            display: none;
            gap: 20px;
            justify-content: center;
            margin-top: 4px;
            width: 100%;
        }
        .vu-mini {
            width: 100px;
            flex-shrink: 0;
        }
        .vu-mini-face {
            background: radial-gradient(ellipse at 50% 120%, #2a1a1a 0%, #1a0a0a 60%, #0a0a0a 100%);
            border-radius: 8px;
            border: 3px solid var(--vu-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .vu-mini-face svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .vu-mini-label {
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            text-align: center;
            margin-top: 4px;
        }

        /* ============================================================
                   VÚMETROS GRANDES + REPRODUCTOR (layout)
                ============================================================ */
        .player-section {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* ============================================================
                   VÚMETROS GRANDES (escritorio/tablet)
                ============================================================ */
        .vu-meter-box {
            width: 165px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .vu-meter-face {
            width: 165px;
            height: 143px;
            background: radial-gradient(ellipse at 50% 120%, #2a1a1a 0%, #1a0a0a 60%, #0a0a0a 100%);
            border-radius: 10px;
            border: 5px solid var(--vu-border);
            box-shadow: 
                0 8px 30px rgba(0, 0, 0, 0.7),
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                0 0 20px var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .vu-meter-face .vu-brand {
            position: absolute;
            top: 6px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 0.55rem;
            letter-spacing: 4px;
            color: #665544;
            opacity: 0.6;
            font-weight: bold;
        }
        .vu-meter-face svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .vu-needle {
            transform-box: view-box;
        }
        .vu-label {
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ============================================================
                   TARJETA DEL REPRODUCTOR (con iframe centrado y MÁS ALTO)
                ============================================================ */
        .player-card {
            flex: 1;
            min-width: 280px;
            max-width: 520px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: background var(--transition), border var(--transition);
        }
        .player-card .iframe-container {
            background: #000;
            width: 100%;
            height: 520px;        /* Antes: 480px */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .player-card .iframe-container iframe {
            width: 90%;
            height: 125%;
            border: none;
            display: block;
	    background: #ffffff;   /* ← FONDO BLANCO */
    	    transform: scale(0.7);        /* ← ¡AQUÍ! Cambia este valor */
            transform-origin: center center;
            position: absolute;
            top: 50%;
            left: 50%;
	    transform: translate(-50%, -50%) scale(0.8);  /* ← Y AQUÍ también */
        }

        /* ============================================================
                   FOOTER
                ============================================================ */
        .footer {
            width: 100%;
            text-align: center;
            padding: 20px 0 10px;
            border-top: 1px solid var(--border);
            margin-top: 10px;
        }
        .footer .contact {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        .footer .contact a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition);
        }
        .footer .contact a:hover {
            color: var(--accent-hover);
        }
        .footer .copy {
            font-size: 0.6rem;
            color: var(--text-muted);
            opacity: 0.5;
            margin-top: 8px;
        }

        /* ============================================================
                   RESPONSIVE - VÚMETROS MÁS GRANDES EN MÓVIL
                ============================================================ */

        /* Tablet y escritorio pequeño: Vúmetros grandes a los lados */
        @media (max-width: 820px) {
            .vu-meter-box {
                width: 140px;
            }
            .vu-meter-face {
                width: 140px;
                height: 121px;
            }
            .player-card .iframe-container {
                height: 460px;    /* Antes: 420px */
            }
            .theme-buttons {
                padding: 0 12px;
            }
            .theme-btn {
                font-size: 0.65rem;
                padding: 6px 12px;
                min-width: 70px;
            }
        }

        /* Móvil grande: Ocultamos Vúmetros grandes, mostramos mini centrados */
        @media (max-width: 700px) {
            .player-section {
                flex-direction: column;
                gap: 14px;
            }
            
            .vu-meter-box {
                display: none;
            }
            
            .vu-mini-wrap {
                display: flex;
            }
            
            .vu-mini {
                width: 110px;
            }
            .vu-mini-label {
                font-size: 0.65rem;
            }
            
            .player-card {
                width: 100%;
                max-width: 100%;
            }
            .player-card .iframe-container {
                height: 420px;    /* Antes: 380px */
            }
        }

        /* Móvil pequeño */
        @media (max-width: 480px) {
            .vu-mini {
                width: 85px;
            }
            .vu-mini-face {
                border-width: 2px;
                border-radius: 6px;
            }
            .vu-mini-label {
                font-size: 0.55rem;
            }
            .vu-mini-wrap {
                gap: 16px;
            }
            .player-card .iframe-container {
                height: 380px;    /* Antes: 340px */
            }
            .theme-btn {
                font-size: 0.55rem;
                padding: 4px 10px;
                min-width: 60px;
            }
            .theme-btn .icon {
                font-size: 0.8rem;
            }
            .logo {
                width: 90px;      /* 25% más grande que antes (72px) */
                height: 90px;
            }
            .hero-title {
                letter-spacing: 3px;
            }
        }

        /* Móvil muy pequeño */
        @media (max-width: 360px) {
            .vu-mini {
                width: 65px;
            }
            .vu-mini-label {
                font-size: 0.45rem;
            }
            .vu-mini-wrap {
                gap: 12px;
            }
            .player-card .iframe-container {
                height: 340px;    /* Antes: 300px */
            }
            .theme-btn {
                font-size: 0.45rem;
                padding: 3px 8px;
                min-width: 50px;
            }
            .theme-btn .icon {
                font-size: 0.6rem;
            }
            .logo {
                width: 75px;      /* 25% más grande que antes (60px) */
                height: 75px;
            }
        }
    </style>
</head>

    <script>
        // ============================================================
        // 1. CAMBIO DE TEMA (ambos botones hacen lo mismo)
        // ============================================================
        (function() {
            const html = document.documentElement;
            const btnLeft = document.getElementById('themeToggleLeft');
            const btnRight = document.getElementById('themeToggleRight');
            const iconLeft = btnLeft.querySelector('.icon');
            const labelLeft = btnLeft.querySelector('.label');
            const iconRight = btnRight.querySelector('.icon');
            const labelRight = btnRight.querySelector('.label');

            // Cargar tema guardado
            const saved = localStorage.getItem('rocket-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initial = saved || (prefersDark ? 'dark' : 'light');
            html.setAttribute('data-theme', initial);
            actualizarBotones(initial);

            function actualizarBotones(tema) {
                const esOscuro = tema === 'dark';
                // CORREGIDO: Si es oscuro → mostramos SOL (para cambiar a claro)
                //           Si es claro → mostramos LUNA (para cambiar a oscuro)
                const icono = esOscuro ? '☀️' : '🌙';
                const texto = esOscuro ? 'Claro' : 'Oscuro';
                
                iconLeft.textContent = icono;
                labelLeft.textContent = texto;
                iconRight.textContent = icono;
                labelRight.textContent = texto;
            }

            function toggleTheme() {
                const actual = html.getAttribute('data-theme');
                const nuevo = actual === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', nuevo);
                localStorage.setItem('rocket-theme', nuevo);
                actualizarBotones(nuevo);
            }

            btnLeft.addEventListener('click', toggleTheme);
            btnRight.addEventListener('click', toggleTheme);
        })();

        // ============================================================
        // 2. AÑO EN EL FOOTER
        // ============================================================
        document.getElementById('year').textContent = new Date().getFullYear();

        // ============================================================
        // 3. FALLBACK DEL LOGO
        // ============================================================
        document.getElementById('logoImg')?.addEventListener('error', function() {
            this.style.display = 'none';
            const fallback = document.createElement('div');
            fallback.textContent = '🚀';
            fallback.style.cssText = 'font-size:4rem; text-align:center; color:var(--accent);';
            this.parentNode.insertBefore(fallback, this);
        });

        // ============================================================
        // 4. VÚMETROS - LÓGICA DE MOVIMIENTO (AUTOMÁTICA)
        // ============================================================
        (function() {
            const ANGULO_REPOSO = -58;
            const ANGULO_MAXIMO = 58;
            const STREAM_URL = 'https://s5.citrus3.com:2020/8556/stream';

            // Todas las agujas de cada canal (grandes + mini)
            const needlesLeft = document.querySelectorAll('.vu-needle-left');
            const needlesRight = document.querySelectorAll('.vu-needle-right');

            let audioCtx = null,
                hiddenAudio = null;
            let analyserL = null,
                analyserR = null,
                dataL = null,
                dataR = null;
            let modoAnalisisReal = true;
            let segundosSinSenalReal = 0;
            let anguloActualL = ANGULO_REPOSO;
            let anguloActualR = ANGULO_REPOSO;

            function moverAgujas(elementos, angulo) {
                elementos.forEach(el => {
                    el.style.transform = 'rotate(' + angulo + 'deg)';
                });
            }

            function calcularVolumenRMS(dataArray) {
                let suma = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    const valor = (dataArray[i] - 128) / 128;
                    suma += valor * valor;
                }
                return Math.min(1, Math.sqrt(suma / dataArray.length) * 4);
            }

            let simFaseL = Math.random() * 10,
                simFaseR = Math.random() * 10;

            function nivelSimulado(fase) {
                const t = Date.now() / 1000;
                const base = 0.5 + 0.3 * Math.sin(t * 1.7 + fase) + 0.15 * Math.sin(t * 4.1 + fase * 2);
                return Math.max(0, Math.min(1, base + (Math.random() - 0.5) * 0.15));
            }

            function loopAnimacion() {
                let nivelL, nivelR;
                if (modoAnalisisReal && analyserL && analyserR) {
                    analyserL.getByteTimeDomainData(dataL);
                    analyserR.getByteTimeDomainData(dataR);
                    nivelL = calcularVolumenRMS(dataL);
                    nivelR = calcularVolumenRMS(dataR);
                    if (nivelL < 0.02 && nivelR < 0.02) {
                        segundosSinSenalReal += 1 / 60;
                        if (segundosSinSenalReal > 4) modoAnalisisReal = false;
                    } else {
                        segundosSinSenalReal = 0;
                    }
                } else {
                    nivelL = nivelSimulado(simFaseL);
                    nivelR = nivelSimulado(simFaseR);
                }

                const objetivoL = ANGULO_REPOSO + nivelL * (ANGULO_MAXIMO - ANGULO_REPOSO);
                const objetivoR = ANGULO_REPOSO + nivelR * (ANGULO_MAXIMO - ANGULO_REPOSO);

                // Inercia (respuesta tipo VU)
                anguloActualL += (objetivoL - anguloActualL) * 0.18;
                anguloActualR += (objetivoR - anguloActualR) * 0.18;

                moverAgujas(needlesLeft, anguloActualL);
                moverAgujas(needlesRight, anguloActualR);

                requestAnimationFrame(loopAnimacion);
            }

            async function iniciarVUMeters() {
                try {
                    hiddenAudio = new Audio();
                    hiddenAudio.crossOrigin = 'anonymous';
                    hiddenAudio.src = STREAM_URL;
                    hiddenAudio.muted = true;
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaElementSource(hiddenAudio);
                    const splitter = audioCtx.createChannelSplitter(2);
                    analyserL = audioCtx.createAnalyser();
                    analyserR = audioCtx.createAnalyser();
                    analyserL.fftSize = 256;
                    analyserR.fftSize = 256;
                    dataL = new Uint8Array(analyserL.frequencyBinCount);
                    dataR = new Uint8Array(analyserR.frequencyBinCount);
                    source.connect(splitter);
                    splitter.connect(analyserL, 0);
                    splitter.connect(analyserR, 1);
                    await hiddenAudio.play();
                } catch (err) {
                    console.warn('Vúmetros: análisis real no disponible, usando modo simulado.', err);
                    modoAnalisisReal = false;
                }
                loopAnimacion();
            }

            // Iniciar en reposo
            moverAgujas(needlesLeft, ANGULO_REPOSO);
            moverAgujas(needlesRight, ANGULO_REPOSO);

            // Iniciar los Vúmetros automáticamente
            iniciarVUMeters();
        })();
    </script>
