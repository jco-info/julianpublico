<style>
  :root{

  body{

    color:var(--txt); line-height:1.5; padding:1rem;

    max-width:980px; margin:0 auto 1.5rem; text-align:center;
    padding:1.5rem 1rem; background:rgba(56,189,248,.08);
    border:1px solid var(--border); border-radius:16px;
  }
  header h1{margin:.2rem 0; font-size:1.5rem}
  header p{margin:.3rem 0; color:var(--muted); font-size:.95rem}
  .bar{
    position:sticky; top:0; z-index:10; max-width:980px; margin:0 auto 1rem;
    display:flex; gap:.6rem; flex-wrap:wrap; align-items:center;
    background:rgba(15,23,42,.92); backdrop-filter:blur(6px);
    padding:.7rem; border-radius:12px; border:1px solid var(--border);
  }
  .bar .score{
    font-weight:700; color:var(--accent); margin-right:auto;
    font-size:.95rem;
  }
  button{
    cursor:pointer; border:1px solid var(--border); border-radius:10px;
    padding:.55rem .9rem; font-size:.9rem; font-weight:600;
    background:var(--card2); color:var(--txt); transition:.15s;
  }
  button:hover{background:#334155; transform:translateY(-1px)}
  button.primary{background:var(--accent); color:#04263a; border-color:var(--accent)}
  button.primary:hover{background:#7dd3fc}
  main{max-width:980px; margin:0 auto}
  section.q{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:1rem 1.1rem; margin-bottom:.9rem;
  }
  .qhead{display:flex; gap:.6rem; align-items:flex-start; margin-bottom:.6rem}
  .num{
    flex:0 0 auto; background:var(--accent); color:#04263a; font-weight:800;
    border-radius:8px; padding:.15rem .5rem; font-size:.85rem; margin-top:.15rem;
  }
  .qtext{font-weight:600}
  .tag{
    display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.4px;
    text-transform:uppercase; padding:.15rem .5rem; border-radius:999px;
    margin-left:.4rem; background:#0ea5e922; color:#7dd3fc; border:1px solid #0ea5e955;
    vertical-align:middle;
  }
  .opts{display:grid; gap:.4rem; margin-top:.4rem}
  label.opt{
    display:flex; gap:.55rem; align-items:flex-start; padding:.5rem .65rem;
    border:1px solid var(--border); border-radius:10px; background:var(--card2);
    cursor:pointer; transition:.12s; font-size:.95rem;
  }
  label.opt:hover{border-color:#475569; background:#2c3b52}
  label.opt input{margin-top:.25rem; accent-color:var(--accent); flex:0 0 auto}
  label.opt.correct{border-color:var(--ok); background:#052e1a}
  label.opt.wrong{border-color:var(--bad); background:#3b0a0a}
  label.opt.missed{border-color:var(--warn); background:#3a2a05}
  .fill{display:grid; gap:.45rem; margin-top:.5rem}
  .fill label{font-size:.9rem; color:var(--muted)}
  .fill input{
    width:100%; padding:.5rem .7rem; border-radius:9px;
    border:1px solid var(--border); background:#0b1220; color:var(--txt);
    font-size:.95rem;
  }
  .fill input:focus{outline:2px solid var(--accent); border-color:transparent}
  .fill input.correct{border-color:var(--ok); background:#052e1a}
  .fill input.wrong{border-color:var(--bad); background:#3b0a0a}
  .fb{margin-top:.55rem; font-size:.88rem; padding:.5rem .7rem; border-radius:9px; display:none}
  .fb.show{display:block}
  .fb.ok{background:#052e1a; border:1px solid var(--ok); color:#bbf7d0}
  .fb.err{background:#3b0a0a; border:1px solid var(--bad); color:#fecaca}
  .fb small{display:block; margin-top:.25rem; color:#e2e8f0}
  .multi-note{font-size:.8rem; color:var(--warn); margin-top:.2rem}
  .match{display:grid; gap:.55rem; margin-top:.5rem}
  .match-row{display:grid; grid-template-columns:1fr 1fr; gap:.5rem; align-items:center}
  .match-row span{font-size:.92rem}
  .match-row select{
    padding:.45rem .5rem; border-radius:9px; border:1px solid var(--border);
    background:#0b1220; color:var(--txt); font-size:.88rem; width:100%;
  }
  .match-row select.correct{border-color:var(--ok); background:#052e1a}
  .match-row select.wrong{border-color:var(--bad); background:#3b0a0a}
  @media(max-width:560px){ .match-row{grid-template-columns:1fr} }
  footer{max-width:980px; margin:2rem auto 1rem; text-align:center; color:var(--muted); font-size:.85rem}
  .hidden{display:none}
</style>

/* ============================================================
   RENDERIZADO
   ============================================================ */
const quizEl = document.getElementById('quiz');
const scoreEl = document.getElementById('score');
let respuestas = new Array(PREGUNTAS.length).fill(null);
let corregidas = new Array(PREGUNTAS.length).fill(false);

function normalizar(s){
  return (s||'').toString().trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function render(){
  quizEl.innerHTML = '';
  PREGUNTAS.forEach((p, i) => {
    const sec = document.createElement('section');
    sec.className = 'q';
    sec.dataset.i = i;

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `<span class="num">${i+1}</span>
      <div class="qtext">${p.q} <span class="tag">${p.src}</span></div>`;
    sec.appendChild(head);

    if(p.type === 'single'){
      const cont = document.createElement('div');
      cont.className = 'opts';
      p.opts.forEach((o, j) => {
        const lab = document.createElement('label');
        lab.className = 'opt';
        lab.innerHTML = `<input type="radio" name="q${i}" value="${j}"> <span>${o}</span>`;
        lab.querySelector('input').addEventListener('change', () => {
          respuestas[i] = j; corregidas[i] = false; limpiarFB(sec); actualizarScore();
        });
        cont.appendChild(lab);
      });
      sec.appendChild(cont);

    } else if(p.type === 'multi'){
      const cont = document.createElement('div');
      cont.className = 'opts';
      p.opts.forEach((o, j) => {
        const lab = document.createElement('label');
        lab.className = 'opt';
        lab.innerHTML = `<input type="checkbox" name="q${i}" value="${j}"> <span>${o}</span>`;
        lab.querySelector('input').addEventListener('change', () => {
          const marcadas = [...sec.querySelectorAll(`input[name="q${i}"]:checked`)].map(x => parseInt(x.value));
          respuestas[i] = marcadas; corregidas[i] = false; limpiarFB(sec); actualizarScore();
        });
        cont.appendChild(lab);
      });
      sec.appendChild(cont);

    } else if(p.type === 'fill'){
      const cont = document.createElement('div');
      cont.className = 'fill';
      p.fields.forEach((f, j) => {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `<label>${f.label}</label>`;
        const inp = document.createElement('input');
        inp.type = 'text'; inp.placeholder = 'Escribe tu respuesta…';
        inp.dataset.field = j;
        inp.addEventListener('input', () => {
          if(!Array.isArray(respuestas[i])) respuestas[i] = [];
          respuestas[i][j] = inp.value;
          corregidas[i] = false; limpiarFB(sec); actualizarScore();
        });
        wrapper.appendChild(inp);
        cont.appendChild(wrapper);
      });
      sec.appendChild(cont);

    } else if(p.type === 'match'){
      const cont = document.createElement('div');
      cont.className = 'match';
      p.pairs.forEach((par, j) => {
        const row = document.createElement('div');
        row.className = 'match-row';
        const span = document.createElement('span');
        span.textContent = par.left;
        const sel = document.createElement('select');
        sel.innerHTML = `<option value="">— Elige —</option>` +
          par.options.map((o, k) => `<option value="${k}">${o}</option>`).join('');
        sel.dataset.pair = j;
        sel.addEventListener('change', () => {
          if(!Array.isArray(respuestas[i])) respuestas[i] = [];
          respuestas[i][j] = sel.value;
          corregidas[i] = false; limpiarFB(sec); actualizarScore();
        });
        row.appendChild(span); row.appendChild(sel);
        cont.appendChild(row);
      });
      sec.appendChild(cont);
    }

    const fb = document.createElement('div');
    fb.className = 'fb';
    sec.appendChild(fb);

    quizEl.appendChild(sec);
  });
}

function limpiarFB(sec){
  const fb = sec.querySelector('.fb');
  fb.className = 'fb'; fb.innerHTML = '';
  sec.querySelectorAll('.correct,.wrong,.missed').forEach(el => el.classList.remove('correct','wrong','missed'));
}

function actualizarScore(){
  scoreEl.textContent = `Puntuación: 0 / ${PREGUNTAS.length}`;
}

/* ============================================================
   CORRECCIÓN
   ============================================================ */
function esCorrecta(p, r){
  if(p.type === 'single') return r === p.correct;
  if(p.type === 'multi'){
    if(!Array.isArray(r)) return false;
    const a = [...new Set(r)].sort().join(',');
    const b = [...p.correct].sort().join(',');
    return a === b && r.length === p.correct.length;
  }
  if(p.type === 'fill'){
    if(!Array.isArray(r)) return false;
    return p.fields.every((f, j) => {
      const val = r[j] || '';
      return f.accept.some(a => normalizar(a) === normalizar(val));
    });
  }
  if(p.type === 'match'){
    if(!Array.isArray(r)) return false;
    return p.pairs.every((par, j) => String(r[j]) === String(par.correct));
  }
  return false;
}

function corregirUna(i){
  const p = PREGUNTAS[i];
  const sec = quizEl.querySelector(`section[data-i="${i}"]`);
  const fb = sec.querySelector('.fb');
  limpiarFB(sec);
  const r = respuestas[i];
  const ok = esCorrecta(p, r);

  // Feedback visual
  if(p.type === 'single'){
    sec.querySelectorAll('input[type=radio]').forEach(inp => {
      const j = parseInt(inp.value);
      const lab = inp.closest('label');
      if(j === p.correct) lab.classList.add('correct');
      if(inp.checked && j !== p.correct) lab.classList.add('wrong');
    });
  } else if(p.type === 'multi'){
    sec.querySelectorAll('input[type=checkbox]').forEach(inp => {
      const j = parseInt(inp.value);
      const lab = inp.closest('label');
      if(p.correct.includes(j)) lab.classList.add('correct');
      if(inp.checked && !p.correct.includes(j)) lab.classList.add('wrong');
      if(!inp.checked && p.correct.includes(j)) lab.classList.add('missed');
    });
  } else if(p.type === 'fill'){
    sec.querySelectorAll('input[type=text]').forEach(inp => {
      const j = parseInt(inp.dataset.field);
      const f = p.fields[j];
      const val = inp.value || '';
      const bien = f.accept.some(a => normalizar(a) === normalizar(val));
      inp.classList.add(bien ? 'correct' : 'wrong');
    });
  } else if(p.type === 'match'){
    sec.querySelectorAll('select').forEach(sel => {
      const j = parseInt(sel.dataset.pair);
      const bien = String(sel.value) === String(p.pairs[j].correct);
      sel.classList.add(bien ? 'correct' : 'wrong');
    });
  }

  // Mensaje
  fb.className = 'fb show ' + (ok ? 'ok' : 'err');
  if(ok){
    fb.innerHTML = '✅ ¡Correcto!';
  } else {
    let correctaTxt = '';
    if(p.type === 'single') correctaTxt = p.opts[p.correct];
    else if(p.type === 'multi') correctaTxt = p.correct.map(j => p.opts[j]).join(' | ');
    else if(p.type === 'fill') correctaTxt = p.fields.map((f,j) => f.accept[0]).join(' | ');
    else if(p.type === 'match') correctaTxt = p.pairs.map(par => `${par.left} → ${par.options[par.correct]}`).join(' ; ');
    fb.innerHTML = `❌ Incorrecto. <small><strong>Respuesta correcta:</strong> ${correctaTxt}</small>`;
  }
  corregidas[i] = true;
}

function corregirTodo(){
  let aciertos = 0;
  PREGUNTAS.forEach((p, i) => {
    corregirUna(i);
    if(esCorrecta(p, respuestas[i])) aciertos++;
  });
  scoreEl.textContent = `Puntuación: ${aciertos} / ${PREGUNTAS.length}`;
  window.scrollTo({top:0, behavior:'smooth'});
}

function reiniciar(){
  respuestas = new Array(PREGUNTAS.length).fill(null);
  corregidas = new Array(PREGUNTAS.length).fill(false);
  render();
  actualizarScore();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============================================================
   INICIO
   ============================================================ */
render();
</script>
